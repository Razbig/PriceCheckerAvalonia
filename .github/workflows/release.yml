name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Windows
        run: |
          dotnet publish PriceCheckerAvalonia/PriceCheckerAvalonia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish/win-x64

      - name: Install Velopack
        shell: pwsh
        run: |
          dotnet tool install -g vpk

      - name: Pack Windows
        shell: pwsh
        run: |
          vpk pack `
            --packId PriceCheckerAvalonia `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish/win-x64 `
            --mainExe PriceCheckerAvalonia.exe `
            --channel win `
            --runtime win-x64 `
            --packTitle "PriceChecker"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack-windows
          path: Releases/*
          if-no-files-found: error


  # ============================================================
  # LINUX
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Linux
        run: |
          dotnet publish PriceCheckerAvalonia/PriceCheckerAvalonia.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish/linux-x64

      - name: Make executable
        run: |
          chmod +x publish/linux-x64/PriceCheckerAvalonia

      - name: Install Velopack
        run: |
          dotnet tool install -g vpk

      - name: Pack Linux
        run: |
          vpk pack \
            --packId PriceCheckerAvalonia \
            --packVersion ${{ steps.version.outputs.version }} \
            --packDir publish/linux-x64 \
            --mainExe PriceCheckerAvalonia \
            --channel linux \
            --runtime linux-x64 \
            --packTitle "PriceChecker"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack-linux
          path: Releases/*
          if-no-files-found: error


  # ============================================================
  # GITHUB RELEASE
  # ============================================================
  release:
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    steps:

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: velopack-windows
          path: release/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: velopack-linux
          path: release/linux

      - name: Show release files
        run: |
          echo "===== WINDOWS ====="
          find release/windows -type f

          echo "===== LINUX ====="
          find release/linux -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PriceChecker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/windows/*
            release/linux/*